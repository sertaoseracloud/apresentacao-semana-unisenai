<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Horizonte 2031</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: palco único de tela cheia; barra de status no topo, slides empilhados no centro, trilho de navegação por módulo na base. Tema escuro único, por escolha. */
:root{
  color-scheme:dark;
  --bg:#0b0d14; --bg2:#11141c; --node:#11141c; --raised:#1a1e28; --panel:rgba(238,240,245,.04); --line:rgba(238,240,245,.08); --line2:rgba(238,240,245,.16);
  --fg:#eef0f5; --mut:#a3a9b8; --bad:#e5484d; --ok:#4cc38a;
  --ac:#8fb4ff; --acr:143,180,255;
  --f-disp:"IBM Plex Sans",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1); --k:1.2;
}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
*{box-sizing:border-box}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
html,body{height:100%;overflow:hidden;overflow:clip;max-width:100vw}
body{margin:0;background:var(--bg);color:var(--fg);font:calc(15px*var(--k))/1.55 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
a{color:var(--ac)} button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding-block:12px;font:500 calc(12px*var(--k)) var(--f-mono);color:var(--mut)}
.top .brand{font:500 calc(14px*var(--k)) var(--f-disp);color:var(--fg)}
.top .brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:8px;transition:background .6s}
.top .mod{color:var(--ac);transition:color .6s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .cnt{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .7s var(--ease),background .6s}

/* palco */
#deck{position:relative;z-index:1;flex:1;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overflow-x:clip;display:grid;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .3s var(--ease),transform .4s var(--ease),visibility 0s .4s;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .4s var(--ease),transform .45s var(--ease),visibility 0s}
.wrap{width:100%;max-width:1320px;margin:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
.kick{margin:0;display:flex;align-items:center;gap:8px;font:500 calc(12px*var(--k)) var(--f-mono);color:var(--mut)}
.pill{padding:4px 8px;border:1px solid var(--line2);border-radius:6px;color:var(--ac)}
.ttl{margin:0;font:500 clamp(28px,4.4vw,60px)/1.08 var(--f-disp);letter-spacing:-.01em;text-wrap:balance}
.ttl .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em;white-space:nowrap}
.ch{display:inline-block}
.lead{margin:0;font-size:clamp(17px,1.7vw,24px);color:var(--fg);max-width:62ch}
.two{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:28px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pts li{position:relative;padding:8px 16px 8px 40px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pts li::before{content:"";position:absolute;left:15px;top:17px;width:10px;height:10px;border:2px solid var(--ac);transform:rotate(45deg)}
.pts b{color:var(--ac);font-weight:500}
.note{margin:0;font:calc(12px*var(--k))/1.5 var(--f-mono);color:var(--mut)}
.note a{color:var(--mut)} .note a:hover{color:var(--ac)}

/* diagramas */
.viz{position:relative;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);min-width:0}
.viz svg{display:block;width:100%;height:auto;max-height:44vh}
.cap{margin:8px 2px 0;min-height:3.1em;font-size:calc(13px*var(--k));color:var(--mut)}
.cap b{color:var(--fg)}
.ln{fill:none;stroke:var(--line2);stroke-width:1.5}
.fl{stroke:var(--c,var(--ac));stroke-dasharray:3 9;stroke-linecap:round;animation:dash 1.1s linear infinite;opacity:.75}
.fl.dim{opacity:.4}
@keyframes dash{to{stroke-dashoffset:-24}}
.pu{}
.nd{cursor:pointer}
.nd rect,.hb circle{fill:var(--node);stroke:var(--c,var(--ac));stroke-width:1.3;transition:fill .16s var(--ease)}
.nd:hover rect,.nd:focus rect,.nd.sel rect{fill:var(--raised)}
.nd:focus{outline:none}
.t1{fill:var(--fg);font:500 14.5px var(--f-body);text-anchor:middle}
.t2{fill:var(--mut);font:12.5px var(--f-mono);text-anchor:middle}
.t3{fill:var(--ac);font:500 13.5px var(--f-mono);text-anchor:middle;}
.hb.ctr circle{stroke-width:2}
.hub.focus .hb:not(.hot):not(.ctr),.hub.focus .lk:not(.hot),.hub.focus .pu:not(.hot){opacity:.18}
.hub .hb,.hub .lk,.hub .pu{transition:opacity .3s}
.hub .hot circle{;fill:var(--raised)}
.nn{stroke:var(--ac);stroke-width:.7;stroke-dasharray:2 10;opacity:.5;animation:dash 1.4s linear infinite}
.nu{fill:var(--node);stroke:var(--ac);stroke-width:1.4}
.loop{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;font:calc(12px*var(--k)) var(--f-mono)}
.loop span{padding:8px 8px;border:1px solid var(--line2);border-radius:8px;animation:step 8s infinite}
.loop span:nth-of-type(2){animation-delay:2s}.loop span:nth-of-type(3){animation-delay:4s}.loop span:nth-of-type(4){animation-delay:6s}
.loop em{color:var(--mut);font-style:normal}
@keyframes step{0%,22%{border-color:var(--ac);color:var(--ac)}26%,100%{border-color:var(--line2);color:var(--fg)}}

/* blockchain interativo */
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.blk{position:relative;padding:8px;border:1px solid var(--ok);border-radius:10px;background:var(--node);font:calc(11px*var(--k))/1.5 var(--f-mono);min-width:0;transition:border-color .3s,box-shadow .3s}
.blk b{display:block;font:500 calc(13px*var(--k)) var(--f-disp);color:var(--ok);margin-bottom:4px}
.blk span{display:block;color:var(--mut);overflow-wrap:anywhere}
.blk span i{font-style:normal;color:var(--fg)}
.blk.tam,.blk.brk{border-color:var(--bad)}
.blk.tam b,.blk.brk b{color:var(--bad)}
.blk::after{content:"";position:absolute;right:-11px;top:50%;width:10px;height:2px;background:var(--ok)}
.blk:last-child::after{display:none}
.blk.brk::before{content:"elo quebrado";position:absolute;top:-9px;right:8px;background:var(--bad);color:#14060a;padding:0 8px;border-radius:4px;font-size:calc(10px*var(--k))}
.blk.tam::before{content:"alterado";position:absolute;top:-9px;right:8px;background:var(--bad);color:#14060a;padding:0 8px;border-radius:4px;font-size:calc(10px*var(--k))}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{padding:8px 16px;border:1px solid var(--line2);border-radius:8px;background:var(--raised);font:500 calc(13px*var(--k)) var(--f-body);transition:background .16s var(--ease),border-color .16s var(--ease),transform .16s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{border-color:var(--ac);background:var(--ac);color:#04060b;font-weight:500}

/* quântica interativa */
.qrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qb{width:86px;height:86px;border-radius:50%;border:1.5px solid var(--ac);position:relative;background:var(--node);flex:none}
.qb i{position:absolute;left:50%;top:50%;width:3px;height:34px;margin:-32px 0 0 -1.5px;background:var(--fg);border-radius:2px;transform-origin:50% 100%;transform:rotate(calc(var(--p,0)*180deg));transition:transform .6s var(--ease)}
.qb.sup i{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(70deg)}50%{transform:rotate(110deg)}}
.qb small{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font:calc(11px*var(--k)) var(--f-mono);color:var(--mut)}
.qb::before,.qb::after{position:absolute;left:0;right:0;text-align:center;font:calc(10px*var(--k)) var(--f-mono);color:var(--mut)}
.qb::before{content:"|0⟩";top:4px}.qb::after{content:"|1⟩";bottom:4px}
.qbars{flex:1;min-width:150px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;height:110px;align-items:end}
.qbars div{position:relative;height:100%;display:flex;align-items:flex-end;border-bottom:1px solid var(--line2)}
.qbars i{display:block;width:100%;height:calc(var(--h,0)*100%);min-height:2px;background:var(--ac);border-radius:4px 4px 0 0;transition:height .5s var(--ease)}
.qbars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font:calc(11px*var(--k)) var(--f-mono);color:var(--mut)}
.qbars b{position:absolute;top:-2px;left:0;right:0;text-align:center;font:500 calc(11px*var(--k)) var(--f-mono);font-variant-numeric:tabular-nums}
.ket{margin:32px 0 0;font:500 calc(15px*var(--k)) var(--f-mono);color:var(--ac)}

/* números */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.num{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.num b{display:block;font:500 clamp(24px,3.2vw,38px)/1.1 var(--f-disp);color:var(--ac);font-variant-numeric:tabular-nums}
.num span{display:block;margin-top:8px;font-size:calc(13px*var(--k))}
.num small{display:block;margin-top:4px;font:calc(11px*var(--k)) var(--f-mono);color:var(--mut)}
.chart{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;gap:8px;min-width:0}
.chart h3,.news h3,.box h3{margin:0;font:500 calc(12px*var(--k)) var(--f-mono);color:var(--mut)}
.bar{display:grid;grid-template-columns:86px minmax(0,1fr) 78px;gap:8px;align-items:center;font:calc(12px*var(--k)) var(--f-mono)}
.bar .trk{height:14px;border-radius:7px;background:rgba(150,180,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--ac);transition:width 1.3s var(--ease) .3s}
.live .bar i{width:var(--w)}
.bar b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.news li{padding:8px 12px;border-left:2px solid var(--ac);background:var(--panel);border-radius:0 8px 8px 0;font-size:calc(13.5px*var(--k))}
.news li b{color:var(--ac);font-weight:500}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:20px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--fg);min-width:0;background:var(--bg2);transition:border-color .16s var(--ease),background .16s var(--ease)}
.card:hover,.card:focus-visible{border-color:var(--line2);background:var(--raised)}
.card em{font:500 calc(11px*var(--k)) var(--f-mono);font-style:normal;color:var(--mut)}
.card strong{font:500 calc(18px*var(--k)) var(--f-disp);}
.card p{margin:0;font-size:calc(13.5px*var(--k));color:var(--mut)}
.card u{margin-top:auto;padding-top:8px;font:500 calc(12px*var(--k)) var(--f-mono);color:var(--ac);text-decoration:none;overflow-wrap:anywhere}
.card u::after{content:" ↗"}
.box{padding:16px 16px;border:1px dashed var(--line2);border-radius:12px;background:rgba(var(--acr),.05)}
.box p{margin:8px 0 0}
.box code,.cases code{font:calc(12.5px*var(--k)) var(--f-mono);color:var(--ac)}

/* integração */
.cases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cases li{padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;background:var(--panel);cursor:default;transition:background .25s,box-shadow .25s}
.cases li:hover,.cases li:focus{background:rgba(150,180,255,.1);outline:none}
.cases em{display:block;font:500 calc(11px*var(--k)) var(--f-mono);font-style:normal;color:var(--c)}
.cases strong{display:block;font:500 calc(15px*var(--k)) var(--f-disp)}
.cases span{font-size:calc(13.5px*var(--k));color:var(--mut)}

/* capa */
.cover{align-items:flex-start;gap:24px}
.cover h1{margin:0;font:500 clamp(34px,6.6vw,84px)/1.02 var(--f-disp);letter-spacing:-.02em;text-wrap:balance}
.grad{display:block;color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border:1px solid var(--c);border-radius:6px;font:500 calc(12px*var(--k)) var(--f-mono);color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.hint{font:calc(12px*var(--k)) var(--f-mono);color:var(--mut)}
kbd{padding:1px 8px;border:1px solid var(--line2);border-radius:4px;font:inherit}

/* mapa */
.map{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.map::before{content:"";position:absolute;left:4%;right:4%;top:17px;height:2px;background:linear-gradient(90deg,transparent,var(--line2) 10%,var(--line2) 90%,transparent)}
.map button{position:relative;width:100%;height:100%;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:44px 8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:transform .16s var(--ease),border-color .16s var(--ease)}
.map button::before{content:"";position:absolute;left:14px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--c)}
.map button:hover{border-color:var(--c)}
.map em{font:500 calc(11px*var(--k)) var(--f-mono);font-style:normal;color:var(--mut);}
.map strong{font:500 calc(15px*var(--k))/1.2 var(--f-disp);color:var(--c)}
.map span{font-size:calc(12.5px*var(--k));color:var(--mut)}

/* radar e carreira */
.radar text{fill:var(--mut);font:12.5px var(--f-mono)}
.radar .ring{fill:none;stroke:var(--line)}
.radar .ax{stroke:var(--line)}
.radar .poly{fill:rgba(var(--acr),.14);stroke:var(--ac);stroke-width:2}
.radar .pt{fill:var(--ac)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs .btn[aria-pressed="true"]{background:var(--ac);color:#04060b;font-weight:500}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.panel{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h3{margin:0;font:500 calc(17px*var(--k)) var(--f-disp);color:var(--ac)}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:calc(13.5px*var(--k))}
.panel li{padding-left:16px;position:relative}
.panel li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:2px;background:var(--ac)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:12px;align-items:flex-start;padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;transition:border-color .25s,background .25s}
.todo input{margin-top:4px;width:17px;height:17px;accent-color:var(--ac);flex:none}
.todo label:has(input:checked){border-color:var(--ok);background:rgba(61,255,162,.07)}
.todo b{color:var(--c);font:500 calc(11px*var(--k)) var(--f-mono);display:block}
.quote{margin:0;font:500 clamp(18px,2.3vw,26px)/1.3 var(--f-disp);text-wrap:balance}

/* quem sou eu */
.who{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1fr);gap:32px;align-items:center}
.photo{position:relative;margin:0;border-radius:18px;padding:8px;background:var(--line2);max-width:400px;justify-self:center;width:100%}
.photo img{display:block;width:100%;aspect-ratio:3/4;max-height:58vh;object-fit:cover;object-position:50% 12%;border-radius:13px;background:#dfe1e6}
.photo figcaption{position:absolute;left:16px;bottom:16px;padding:4px 8px;border-radius:8px;background:rgba(11,13,20,.82);font:500 calc(11px*var(--k)) var(--f-mono);color:var(--fg)}
.name{margin:0;font:500 clamp(30px,4.6vw,56px)/1.02 var(--f-disp)}
.role{margin:0;font:500 calc(14px*var(--k)) var(--f-mono);color:var(--ac);}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:calc(13.5px*var(--k))}
.fact b{display:block;font:500 calc(14px*var(--k)) var(--f-disp);color:var(--ac)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{padding:8px 12px;border:1px solid var(--line2);border-radius:6px;font:500 calc(12px*var(--k)) var(--f-mono);text-decoration:none;transition:border-color .16s var(--ease)}
.links a:hover{border-color:var(--ac)}
/* pesquisa aplicada */
.org{display:flex;gap:8px;align-items:center;min-width:0}
.org i{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line2);background:var(--raised);color:var(--ac);font:500 calc(13px*var(--k)) var(--f-disp);font-style:normal;}
.org.u i{border-radius:50%}
.org span{display:flex;flex-direction:column;min-width:0;font-size:calc(13px*var(--k));line-height:1.3}
.org em{font-size:calc(10.5px*var(--k))}

/* trilho */
.dock{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding-block:8px;border-top:1px solid var(--line);background:var(--bg);}
.nav{width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);font-size:calc(18px*var(--k));flex:none;transition:border-color .16s var(--ease)}
.nav:hover:not(:disabled){border-color:var(--ac)}
.nav:disabled{opacity:.3;cursor:default}
.dots{flex:1;display:flex;justify-content:center;gap:4px;min-width:0}
.grp{display:flex;align-items:center;gap:2px;padding:0 8px;border-left:1px solid var(--line)}
.grp:first-child{border-left:0}
.dot{width:20px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line2);transition:background .16s var(--ease)}
.dot:hover::before{background:var(--c)}
.dot.seen::before{background:color-mix(in srgb,var(--c) 55%,transparent)}
.dot.cur::before{width:12px;height:12px;background:var(--c)}
.mini{display:none;flex:1;text-align:center;font:calc(12px*var(--k)) var(--f-mono);color:var(--mut)}

@media (min-width:1500px){:root{--k:1.4}}
@media (min-width:1900px){:root{--k:1.65}.wrap{max-width:1560px}}
@media (max-width:900px){
  :root{--k:1.08}
  .who{grid-template-columns:minmax(0,1fr)} .photo{max-width:260px}
  .two{grid-template-columns:minmax(0,1fr)} .cards,.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))} .map{grid-template-columns:repeat(2,minmax(0,1fr))} .map::before,  .dots{display:none} .mini{display:block} .wrap{margin:0 auto}
}
@media (max-width:560px){
  .cards,.cols3,.map{grid-template-columns:minmax(0,1fr)} .chain{grid-template-columns:repeat(2,minmax(0,1fr))} .blk::after{display:none}
  .bar{grid-template-columns:64px minmax(0,1fr) 66px} .top .mod{display:none}
}

/* --- Quântica --- */
{m:4,type:'def',viz:'q',k:'Qubits, superposição e emaranhamento',t:'Calcular com as regras da natureza',
 lead:'Um bit é 0 ou 1. Um qubit pode estar em uma combinação dos dois até ser medido. Com vários qubits emaranhados, certos problemas ganham atalhos que nenhum computador clássico tem.',
 pts:['<b>Superposição</b>: a porta Hadamard (H) coloca o qubit em 50% |0⟩ e 50% |1⟩.','<b>Emaranhamento</b>: a porta CNOT liga dois qubits. Medir um define o outro.','<b>Medição</b> colapsa o estado. O algoritmo precisa ser desenhado para que a resposta certa seja a mais provável.','<b>Correção de erros</b> é o grande desafio: qubits são frágeis, e muitos qubits físicos formam um qubit lógico confiável.']},

(function chain(){const root=$('[data-viz="bc"]');if(!root)return;
 const base=['Ana → Bia: 5 tokens','Sensor 12: 4,1 °C','Contrato: paga se ≤ 8 °C','Pagamento liberado'];let data=base.slice();
 const h=s=>{let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return (x>>>0).toString(16).padStart(8,'0')};
 const seal=[];let p='00000000';base.forEach((d,i)=>{const hh=h(i+d+p);seal.push({prev:p,hash:hh});p=hh});
 function draw(){let casc=false,bad=false;
  $('.chain',root).innerHTML=data.map((d,i)=>{const now=h(i+d+seal[i].prev),tam=now!==seal[i].hash,st=tam?'tam':casc?'brk':'';if(tam){casc=true;bad=true}
   return `<div class="blk ${st}"><b>Bloco ${i+1}</b><span>dado: <i>${d}</i></span><span>anterior: <i>${seal[i].prev}</i></span><span>hash: <i>${now}</i></span></div>`}).join('');
  $('.cap',root).innerHTML=bad?'<b>Fraude detectada.</b> O dado do bloco 2 mudou, então o hash dele mudou. O bloco 3 ainda aponta para o hash antigo: a cadeia inteira a partir dali fica inválida, e os outros nós rejeitam essa versão.':'<b>Cadeia íntegra.</b> Cada bloco guarda o hash do anterior. Experimente adulterar a leitura do sensor no bloco 2.';
  $('[data-x="tam"]',root).disabled=bad;$('[data-x="fix"]',root).disabled=!bad}
 root.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;data=base.slice();if(b.dataset.x==='tam')data[1]='Sensor 12: 2,0 °C';draw()});draw()})();

(function quantum(){const root=$('[data-viz="q"]');if(!root)return;let p=[1,0,0,0],note='';const L=['00','01','10','11'];
 function draw(){const basis=p.includes(1),m0=p[2]+p[3],m1=p[1]+p[3];
  $$('.qbars div',root).forEach((d,i)=>{$('i',d).style.setProperty('--h',p[i]);$('b',d).textContent=Math.round(p[i]*100)+'%'});
  [m0,m1].forEach((m,i)=>{const q=$(`[data-q="${i}"]`,root);q.style.setProperty('--p',m);q.classList.toggle('sup',m===.5)});
  const nz=L.filter((_,i)=>p[i]>0),ent=!basis&&nz[0][0]!==nz[1][0]&&nz[0][1]!==nz[1][1];
  $('.ket',root).textContent=basis?'|ψ⟩ = |'+nz[0]+'⟩':'|ψ⟩ = ( |'+nz[0]+'⟩ + |'+nz[1]+'⟩ ) / √2';
  $('.cap',root).innerHTML=note||(basis?'<b>Estado clássico.</b> Os dois qubits têm valor definido. Aplique a porta H no qubit 0.':ent?'<b>Emaranhados.</b> Só restam 00 e 11. Meça: os dois qubits sempre saem iguais, mesmo sem nenhum sinal entre eles.':'<b>Superposição.</b> O qubit 0 é 0 e 1 ao mesmo tempo, com 50% de chance cada. Aplique CNOT para emaranhar com o qubit 1.');
  $('[data-x="h"]',root).disabled=!basis;$('[data-x="m"]',root).disabled=basis}
 root.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;note='';
  if(x==='h'){const y=p.indexOf(1)%2;p=[0,0,0,0];p[y]=.5;p[2+y]=.5}
  else if(x==='cx'){p=[p[0],p[1],p[3],p[2]]}
  else if(x==='m'){let r=Math.random(),k=0;for(let i=0;i<4;i++){r-=p[i];if(r<0){k=i;break}}p=[0,0,0,0];p[k]=1;note='<b>Medição: '+L[k]+'.</b> A superposição colapsou para um único resultado. Reinicie e repita para ver o sorteio mudar.'}
  else p=[1,0,0,0];draw()});draw()})();

(function radar(){const svg=$('.radar');if(!svg)return;
 const AX=['IA e dados','Redes e segurança','Cloud e edge','Programação','Pensamento analítico','Criatividade','Aprendizado contínuo','Comunicação'];
 const TR=[[95,55,70,85,90,75,90,70],[65,95,85,75,80,60,85,65],[55,90,65,90,85,60,85,60],[70,60,55,80,100,70,95,60]];
 const R0=120,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/AX.length;return[Math.cos(a)*R0*v/100,Math.sin(a)*R0*v/100]};
 let h='';[25,50,75,100].forEach(r=>h+=`<polygon class="ring" points="${AX.map((_,i)=>pt(i,r).map(n=>n.toFixed(1)).join(',')).join(' ')}"/>`);
 AX.forEach((t,i)=>{const[x,y]=pt(i,100),[lx,ly]=pt(i,116);h+=`<line class="ax" x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${Math.abs(lx)<8?'middle':lx>0?'start':'end'}">${t}</text>`});
 h+='<polygon class="poly"/>'+AX.map(()=>'<circle class="pt" r="3.5"/>').join('');svg.innerHTML=h;
 const poly=$('.poly',svg),pts=$$('.pt',svg);let cur=AX.map(()=>0),raf;
 const paint=()=>{const P=cur.map((v,i)=>pt(i,v));poly.setAttribute('points',P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));pts.forEach((c,i)=>{c.setAttribute('cx',P[i][0]);c.setAttribute('cy',P[i][1])})};
 function to(t,from){cancelAnimationFrame(raf);const a=from||cur.slice(),b=TR[t],t0=performance.now();if(RM){cur=b.slice();return paint()}
  (function step(now){const k=Math.min(1,(now-t0)/900),e=1-Math.pow(1-k,3);cur=a.map((v,i)=>v+(b[i]-v)*e);paint();if(k<1)raf=requestAnimationFrame(step)})(t0)}
 let track=0;cur=TR[0].slice();paint();
 $$('[data-track]').forEach(b=>b.addEventListener('click',()=>{track=+b.dataset.track;$$('[data-track]').forEach(x=>x.setAttribute('aria-pressed',x===b));to(track)}));
 svg.closest('.slide').addEventListener('enter',()=>to(track,AX.map(()=>0)))})();

/* tilt 3D nos cards */
if(!RM&&matchMedia('(hover:hover)').matches)$$('.card').forEach(c=>{
 c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  c.style.setProperty('--ry',((x-.5)*14).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-y)*12).toFixed(2)+'deg');c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%')});
 c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')})});

/* ---------- navegação ---------- */
let cur=-1;const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function countUp(el){$$('[data-n]',el).forEach(b=>{const v=+b.dataset.n,d=+b.dataset.d,raw=b.dataset.raw,pre=b.dataset.pre,suf=b.dataset.suf,from=raw?v-30:0,t0=performance.now();
 const put=x=>b.textContent=pre+(raw?Math.round(x):fmt(x,d))+suf;if(RM)return put(v);
 (function step(now){const k=Math.min(1,(now-t0)/1500),e=1-Math.pow(1-k,3);put(from+(v-from)*e);if(k<1&&el.classList.contains('on'))requestAnimationFrame(step);else put(v)})(t0)})}
function go(n,silent){n=Math.max(0,Math.min(S.length-1,n));if(n===cur)return;const dir=n>cur?1:-1,old=els[cur],el=els[n],m=M[S[n].m];
 if(old){old.style.setProperty('--from',-dir);old.classList.remove('on','live');old.setAttribute('aria-hidden','true');old.inert=true}
 el.style.transition='none';el.style.setProperty('--from',dir);void el.offsetWidth;el.style.transition='';
 el.classList.add('on');el.removeAttribute('aria-hidden');el.inert=false;el.scrollTop=0;cur=n;fit(el);
 const rgb=hex(m.c);document.body.style.setProperty('--ac',m.c);document.body.style.setProperty('--acr',rgb.join(','));tgt=rgb;
 $('#mod').textContent='Módulo '+(S[n].m+1)+' · '+m.n;$('#cnt').textContent=String(n+1).padStart(2,'0')+' / '+S.length;$('#mini').textContent=m.n+' · '+(n+1)+'/'+S.length;
 $('#prog').style.width=((n+1)/S.length*100)+'%';$('#prev').disabled=n===0;$('#next').disabled=n===S.length-1;
 dotEls.forEach((d,i)=>{d.classList.toggle('cur',i===n);d.classList.toggle('seen',i<n);if(i===n)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current')});
 if(G&&!RM){const ch=$$('.ch',el),it=$$('[data-a]',el);G.killTweensOf([ch,it]);
    G.fromTo(it,{y:10,opacity:0},{y:0,opacity:1,duration:.4,stagger:.04,ease:'power2.out',delay:.08,clearProps:'transform,opacity'})}
 requestAnimationFrame(()=>el.classList.add('live'));countUp(el);el.dispatchEvent(new Event('enter'));
 if(!silent)try{location.hash='sl'+(n+1)}catch(e){}}
const fromHash=()=>{const k=/^#sl(\d+)$/.exec(location.hash);return k?+k[1]-1:0};
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
$('#prev').addEventListener('click',()=>go(cur-1));$('#next').addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const tag=e.target.tagName;
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(cur+1)}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
 else if(e.key===' '&&tag!=='BUTTON'&&tag!=='INPUT'&&tag!=='A'){e.preventDefault();go(cur+1)}
 else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(S.length-1)}});
let tx=0,ty=0;deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
deck.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.8)go(cur+(dx<0?1:-1))},{passive:true});
addEventListener('hashchange',()=>go(fromHash(),true));

/* ---------- partículas ---------- */
const cv=$('#bg'),cx=cv.getContext('2d');let W=0,H=0,ps=[],mx=-9999,my=-9999,rgbC=[143,180,255],tgt=[143,180,255],run=false;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
 const n=Math.round(Math.max(24,Math.min(96,W*H/15000)));ps=Array.from({length:n},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:1+Math.random()*1.8,k:i%6}));}
function frame(){for(let i=0;i<3;i++)rgbC[i]+=(tgt[i]-rgbC[i])*.05;const c=a=>'rgba('+(rgbC[0]|0)+','+(rgbC[1]|0)+','+(rgbC[2]|0)+','+a+')';
 cx.clearRect(0,0,W,H);
 for(const p of ps){const dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;if(d2<32400){const d=Math.sqrt(d2)||1,f=(180-d)/180*.35;p.x+=dx/d*f;p.y+=dy/d*f}
  p.x+=p.vx;p.y+=p.vy;if(p.x<-20)p.x=W+20;else if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;else if(p.y>H+20)p.y=-20}
 cx.lineWidth=1;
 for(let i=0;i<ps.length;i++){const a=ps[i];
  for(let j=i+1;j<ps.length;j++){const b=ps[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<16900){cx.strokeStyle=c((1-d2/16900)*.16);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
  const mdx=a.x-mx,mdy=a.y-my,m2=mdx*mdx+mdy*mdy;if(m2<40000){cx.strokeStyle=c((1-m2/40000)*.45);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(mx,my);cx.stroke()}}
 for(const p of ps){cx.fillStyle=c(.55);cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
  if(p.k===0){cx.strokeStyle=c(.35);cx.beginPath();cx.arc(p.x,p.y,p.r+5,0,6.283);cx.stroke()}
  else if(p.k===1){cx.strokeStyle=c(.3);cx.strokeRect(p.x-5,p.y-5,10,10)}}
 if(run)requestAnimationFrame(frame)}
function start(){if(run||document.hidden)return;run=true;requestAnimationFrame(frame)}
addEventListener('resize',size);addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
document.addEventListener('pointerleave',()=>{mx=my=-9999});document.addEventListener('visibilitychange',()=>{if(document.hidden)run=false;else start()});

/* ---------- ajuste à tela: sem barra de rolagem ---------- */
function fit(el){el=el||els[cur];if(!el)return;const w=el.firstElementChild;if(!w)return;
 el.scrollLeft=0;document.documentElement.scrollLeft=0;document.body.scrollLeft=0;const st=w.style;st.transform='';st.width='';st.maxWidth='';st.margin='';st.transformOrigin='0 0';el.style.overflowY='';
 if(innerWidth<=900)return;
 const avail=el.clientHeight;if(!avail||w.offsetHeight<=avail)return;
 el.style.overflowY='hidden';const cw=el.clientWidth,tw=Math.min(cw,parseFloat(getComputedStyle(w).maxWidth)||cw);
 let z=1,h=w.offsetHeight;st.margin='0';
 for(let k=0;k<12;k++){z=Math.max(.55,z-.05);st.maxWidth='none';st.width=(tw/z)+'px';st.transform='scale('+z+')';h=w.offsetHeight*z;if(h<=avail-16||z<=.55)break}
 st.transform='translate('+(cw-tw)/2+'px,'+Math.max(0,(avail-h)/2)+'px) scale('+z.toFixed(3)+')'}
addEventListener('resize',()=>fit());
document.fonts&&document.fonts.ready.then(()=>fit());
deck.addEventListener('load',()=>{if(!document.querySelector('.slide.on.live.fitted'))fit()},true);
size();start();go(fromHash(),true);
})();
